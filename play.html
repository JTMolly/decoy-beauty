<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光的配方｜Decoy（內部試玩）</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="60 秒、4 個選擇，調出妳的照顧水晶。內部試玩版。">
<meta property="og:title" content="光的配方｜Decoy">
<meta property="og:description" content="60 秒、4 個選擇，調出妳的照顧水晶。">
<meta property="og:image" content="https://decoy-beauty.com/quiz-assets/og.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FBF7F4">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Serif+TC:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Decoy 照顧節奏測驗 v1 — colours follow the website (reserve.html) and the brand rule: no pure black text */
:root{
  --bg:#FBF7F4; --wash:#F5ECEE; --pale:#EDD8DC;
  --ink:#5B3B40; --ink-2:#7A565C; --muted:#9A8580;
  --rose:#A86878; --rose-deep:#8B5060; --line:rgba(168,104,120,.2);
  --serif:"Cormorant Garamond",serif; --cjk:"Noto Serif TC","Songti TC",serif; --mono:"IBM Plex Mono",monospace;
  --accent:#C99AA0; --accent-deep:#8B5060;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100svh;color:var(--ink);font-family:var(--cjk);
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 50% at 15% 0%,#F3E2E5 0%,transparent 60%),radial-gradient(ellipse 70% 45% at 100% 100%,#F1E4DC 0%,transparent 60%);
  background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100svh;padding:28px 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;height:28px;margin-bottom:20px}
.brand{display:block;width:84px;height:13px;background:var(--rose-deep);-webkit-mask:url(quiz-assets/word.png) left center/contain no-repeat;mask:url(quiz-assets/word.png) left center/contain no-repeat}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
#view{flex:1;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.opt,.btn{transition:none}}

/* intro */
.intro{justify-content:center;text-align:center;padding-bottom:40px}
.intro .en{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--rose);letter-spacing:.04em;margin-bottom:14px}
.intro h1{font-weight:400;font-size:34px;letter-spacing:.16em;text-indent:.16em;margin-bottom:18px}
.intro p{font-size:16px;line-height:1.9;color:var(--ink-2)}
.intro .orbs{display:flex;justify-content:center;gap:10px;margin:36px 0}
.intro .orbs i{width:34px;height:34px;border-radius:50%;display:block;background:url(quiz-assets/crystal-thumbs.jpg) 0 0/500% 100% no-repeat;box-shadow:0 4px 10px rgba(120,70,78,.15)}
.intro .note{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.8}
/* 10/10 概念 1（Molly 10/10「好棒 試試看吧」）：第一題就是第一屏。上面先講「做完得到什麼」，下面五顆水晶點一顆就開始，不用再按「開始測驗」。
   只用 CSS（卡片光澤、點選回饋），不加圖檔；系統設定「減少動態」就不播。 */
.gate{padding-bottom:16px}
.gate-lead{text-align:center;font-size:15px;letter-spacing:.08em;color:var(--ink-2);margin-bottom:10px}
.gate-lead b{color:var(--rose-deep);font-weight:500}
.gcard{position:relative;width:236px;height:112px;margin:0 auto;border-radius:14px;overflow:hidden;background:#FFFDFB;box-shadow:0 10px 26px rgba(120,70,78,.18);transform:perspective(600px) rotateX(6deg) rotateY(-10deg)}
.gcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:75% 50%}
.gcard .fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,250,247,.92) 0%,rgba(255,250,247,.75) 42%,rgba(255,250,247,0) 70%)}
.gcard .gloss{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-120%);animation:gloss 4.5s ease-in-out 1s infinite}
@keyframes gloss{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.gcard .dc-t{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:9px 14px 0;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--rose)}
.gcard .dc-n{position:absolute;left:14px;bottom:10px;text-align:left;font-size:15px;letter-spacing:.14em;color:var(--ink)}
.gcard .dc-n small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--rose);margin-top:2px}
.chips{list-style:none;display:flex;justify-content:center;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.chips li{font-size:12px;letter-spacing:.04em;color:var(--rose-deep);border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:999px;padding:4px 10px}
.gate-q{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.gate-q .progress{margin-bottom:12px}
.gate-q h1{font-weight:500;font-size:22px;letter-spacing:.1em;text-align:center;margin-bottom:14px}
.crystals{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.crys{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;color:var(--ink-2);min-height:44px;padding:2px 0}
.crys i{width:56px;height:56px;border-radius:50%;display:block;background:url(quiz-assets/crystal-thumbs.jpg) 0 0/500% 100% no-repeat;box-shadow:0 6px 14px rgba(120,70,78,.18),0 0 0 2px #fff;transition:transform .18s ease,box-shadow .18s ease}
.crys:active i{transform:scale(.94)}
.crys.on i{transform:scale(1.06);box-shadow:0 8px 18px rgba(120,70,78,.28),0 0 0 2px #fff,0 0 0 4px var(--rose)}
.gate .note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.7}
.gate .note b{color:var(--rose-deep);font-weight:500}
@media (prefers-reduced-motion:reduce){.gcard .gloss{animation:none;opacity:0}.crys i{transition:none}}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:14px 20px;border-radius:999px;font-size:16px;letter-spacing:.12em;text-decoration:none;transition:background .2s,border-color .2s,transform .1s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--rose-deep);color:#FFF8F4}
.btn-primary:hover{background:#7A4553}
.btn-line{background:#06C755;color:#fff;letter-spacing:.06em}
.btn-line:hover{background:#05b34c}
.btn-ghost{border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.55)}
.btn-ghost:hover{border-color:var(--rose)}
.btn-text{font-size:14px;color:var(--muted);letter-spacing:.08em;padding:10px;min-height:44px}
.btn svg{width:22px;height:22px;flex-shrink:0}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px}

/* question */
.progress{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.progress .num{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--rose-deep);min-width:52px}
.progress .bar{flex:1;height:2px;background:var(--pale);border-radius:2px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--rose);transition:width .35s ease}
.q{font-weight:400;font-size:23px;line-height:1.6;letter-spacing:.06em;margin-bottom:28px}
.q.has-hint{margin-bottom:8px}
.q-hint{font-size:13px;color:var(--muted);letter-spacing:.04em;margin-bottom:24px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{text-align:left;width:100%;min-height:56px;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.62);font-size:16px;line-height:1.6;letter-spacing:.04em;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--rose)}
.opt.on{border-color:var(--rose-deep);background:#fff;box-shadow:0 0 0 1px var(--rose-deep) inset}
.back{align-self:flex-start;margin-top:22px}

/* result */
.result{text-align:center}
.result .lead{font-size:14px;color:var(--muted);letter-spacing:.2em;margin-bottom:6px}
.orb{width:260px;height:260px;max-width:72vw;max-height:72vw;border-radius:22px;margin:8px auto 14px;background:#F3E9E4 center/cover no-repeat;box-shadow:0 16px 40px rgba(120,70,78,.18)}
/* 10/10 廣告漏斗：矮螢幕（IG 內建瀏覽器只剩約 560px 高）把水晶縮小，領卡按鈕才會在第一屏 */
.orb{max-width:min(72vw,29svh);max-height:min(72vw,29svh)}
.result h2{font-weight:500;font-size:38px;letter-spacing:.14em;text-indent:.14em;color:var(--accent-deep)}
.result .en{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink-2);margin:4px 0 10px}
.result .line{font-size:18px;line-height:1.85;letter-spacing:.06em;padding:0 6px;text-wrap:balance}
.q,.intro p{text-wrap:balance}
.result .desc{font-size:15px;line-height:1.95;color:var(--ink-2);margin:18px 0 6px;text-align:left}
.card{text-align:left;border-top:1px solid var(--line);padding:18px 2px 4px;margin-top:18px}
.card h3{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--rose-deep);margin-bottom:8px;text-transform:uppercase}
.card h3 span{font-family:var(--cjk);font-size:14px;letter-spacing:.14em;margin-left:8px;color:var(--ink);text-transform:none}
.card p{font-size:15px;line-height:1.9;color:var(--ink-2)}
.second{margin-top:22px;border:1px dashed var(--line);border-radius:14px;padding:14px 16px;text-align:left}
.second button{width:100%;text-align:left;font-size:15px;color:var(--rose-deep);letter-spacing:.06em;min-height:28px}
.second .reveal{margin-top:10px;font-size:15px;line-height:1.85;color:var(--ink-2)}
.second .reveal b{font-weight:500;color:var(--ink)}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.actions .hint{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:-4px}
.founding{font-size:13px;color:var(--rose-deep);letter-spacing:.06em;margin-bottom:-2px}
/* 10/10 廣告漏斗：領卡按鈕緊接在節奏名稱下面。原本的三步驟框（v1.1「不知道怎麼領」）濃縮成按鈕下的一行「記得按傳送」 */
.actions.claim{margin-top:14px;gap:10px}
.claim .send-tip{color:var(--rose-deep)}
/* 品牌影片（頁內播放，不自動播放） */
.film{margin-top:30px;text-align:left;border-top:1px solid var(--line);padding-top:18px}
/* 10/9 FB／IG／Threads 內建瀏覽器常打不開 LINE App：多一段提示和「複製領卡暗號」 */
.inapp{margin-top:2px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line);text-align:left;font-size:13.5px;line-height:1.8;color:var(--ink-2)}
.inapp b{color:var(--rose-deep);font-weight:500}
.inapp ol{margin:6px 0 0 18px}
.inapp button{margin:6px 0 2px;padding:7px 14px;border:1px solid var(--rose);border-radius:999px;background:#fff;color:var(--rose-deep);font-size:13.5px}
.film h3{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--rose-deep);margin-bottom:10px;text-transform:uppercase}
.film h3 span{font-family:var(--cjk);font-size:14px;letter-spacing:.14em;margin-left:8px;color:var(--ink);text-transform:none}
.film video{display:block;width:100%;aspect-ratio:16/9;border-radius:14px;background:#EFE3E1;box-shadow:0 10px 26px rgba(139,80,96,.12)}
.film p{font-size:13px;line-height:1.8;color:var(--muted);margin-top:8px}
.foot{margin-top:34px;text-align:center;font-size:12px;line-height:1.8;color:var(--muted)}
.foot .slogan{font-family:var(--serif);font-size:15px;letter-spacing:.2em;color:var(--rose-deep);margin-bottom:2px}
.foot a{text-decoration:none;border-bottom:1px solid var(--line)}

/* save-card sheet */
.sheet{position:fixed;inset:0;background:rgba(61,24,36,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.sheet .panel{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));text-align:center}
.sheet img{width:62%;max-width:260px;border-radius:12px;box-shadow:0 8px 30px rgba(91,59,64,.18);margin:6px auto 12px;display:block}
.sheet p{font-size:14px;color:var(--ink-2);line-height:1.8;margin-bottom:12px}
.sheet .row{display:flex;flex-direction:column;gap:10px}
/* 10/10 結果頁固定領卡條（Molly 10/10 核准；參考 puma.taipei 一直看得到的 LINE 按鈕）：
   領卡按鈕滑到畫面上方之外時，底部出現一條同樣的綠色按鈕；滑回來就收起。 */
.claimbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(251,247,244,.94);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(120,70,78,.08);transform:translateY(110%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.claimbar.show{transform:none;visibility:visible;transition:transform .25s ease}
.claimbar .btn{max-width:420px;min-height:46px;padding:10px 16px;font-size:15px;white-space:nowrap}
.claimbar .cb-help{flex-shrink:0;min-height:44px;padding:0 2px;font-size:12.5px;color:var(--rose-deep);text-decoration:underline;text-underline-offset:3px}
.result{padding-bottom:64px}
@media (prefers-reduced-motion:reduce){.claimbar,.claimbar.show{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== 光的配方（小遊戲方向 A）內部試玩版 10/10：Molly「請用Ａ版本 先跑一版我們自己先玩玩看吧」。不連結、noindex、src=playtest ===== */
.game{padding-bottom:12px}
.g-h1{font-size:22px;font-weight:500;letter-spacing:.08em;line-height:1.45;text-align:center}
.g-h1 em{font-style:normal;color:var(--rose-deep)}
.g-sub{font-size:13px;color:var(--ink-2);text-align:center;margin-top:4px;letter-spacing:.04em}
.g-chips{list-style:none;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.g-chips li{font-size:11.5px;color:var(--rose-deep);border:1px solid var(--line);background:rgba(255,255,255,.65);border-radius:999px;padding:2px 9px}
.g-facets{display:flex;justify-content:center;gap:9px;margin:12px 0 6px}
.g-facets i{width:12px;height:12px;transform:rotate(45deg);border:1px solid var(--rose);display:block;transition:background .3s}
.g-facets i.on{background:var(--rose)}
.g-crystal{width:min(150px,24svh);height:min(150px,24svh);margin:2px auto 0;position:relative}
.g-first .g-crystal{width:min(92px,15svh);height:min(92px,15svh)}
.g-crystal svg{width:100%;height:100%;display:block;overflow:visible}
.g-crystal .fc{transition:fill .45s ease}
.g-q{font-size:17px;font-weight:500;text-align:center;letter-spacing:.06em;margin:10px 0 10px;line-height:1.5}
.g-opts{display:flex;flex-direction:column;gap:7px}
.g-opt{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.78);font-size:14px;color:var(--ink);letter-spacing:.03em;text-align:left;line-height:1.45;transition:border-color .2s,background .2s,transform .1s}
.g-opt:active{transform:scale(.985)}
.g-opt i{width:16px;height:16px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 2px 8px rgba(120,70,78,.18)}
.g-opt.on{border-color:var(--rose);background:#fff;box-shadow:0 4px 14px rgba(168,104,120,.15)}
.g-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:9px;line-height:1.6}
.g-note b{color:var(--rose-deep);font-weight:500}
.g-drop{position:fixed;width:16px;height:16px;border-radius:50%;pointer-events:none;z-index:30;box-shadow:0 0 12px rgba(255,255,255,.9)}
.g-reveal{justify-content:center;align-items:center;text-align:center;min-height:70svh}
.g-reveal .g-crystal{width:min(210px,34svh);height:min(210px,34svh);animation:gPulse 1.4s ease-in-out both}
.g-reveal .k{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--rose);margin-top:22px}
@keyframes gPulse{0%{transform:scale(.92) rotate(-6deg);filter:brightness(1)}60%{transform:scale(1.04) rotate(2deg);filter:brightness(1.12)}100%{transform:scale(1) rotate(0);filter:brightness(1.05)}}
.g-card{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;box-shadow:0 8px 20px rgba(120,70,78,.1)}
.g-card .th{width:52px;height:52px;border-radius:10px;background:center/cover no-repeat;flex-shrink:0}
.g-card .t1{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--rose)}
.g-card .t2{font-size:14.5px;margin-top:2px;letter-spacing:.06em;color:var(--ink)}
.g-card .t3{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);margin-top:2px}
.g-card .blur{filter:blur(3.5px);display:inline-block}
.result .orb{max-width:min(72vw,24svh);max-height:min(72vw,24svh)}
@media (max-height:620px){.app{padding-top:16px}.top{margin-bottom:10px}.g-sub{display:none}.g-first .g-facets{display:none}.g-first .g-crystal{width:13svh;height:13svh;margin-top:8px}.g-facets{margin:6px 0 4px}.g-q{margin:8px 0}.g-opts{gap:6px}}
@media (prefers-reduced-motion:reduce){.g-reveal .g-crystal{animation:none}.g-crystal .fc{transition:none}}

/* 合不合（Molly 10/10「合不合可以喔！好好玩喔」；15 組短句為 Cook 草稿 v1，公開前待 Molly 審）＋到店小禮（條件待定） */
.g-invite{display:inline-block;margin:0 auto 8px;font-size:12px;color:var(--rose-deep);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 12px;letter-spacing:.04em}
.g-first .g-invite-wrap{text-align:center}
.g-gift{font-size:12.5px;color:var(--rose-deep);letter-spacing:.04em;margin-top:-2px}
.g-gift span{display:inline-block}
.g-share{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.7);font-size:14px;color:var(--ink);letter-spacing:.06em}
.g-share.done{border-color:var(--rose);color:var(--rose-deep)}
.g-pair{margin-top:18px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:18px 18px 14px;text-align:center;box-shadow:0 10px 24px rgba(120,70,78,.1)}
.g-pair .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--rose)}
.g-pair .pn{margin-top:8px;font-size:17px;letter-spacing:.08em;color:var(--ink)}
.g-pair .pn small{font-size:11px;color:var(--muted);margin:0 4px}
.g-pair p{margin-top:10px;font-size:15px;line-height:1.9;color:var(--ink-2);text-align:left}
.g-pair .fine{margin-top:8px;font-size:11px;color:var(--muted)}
.g-pair-hint{color:var(--rose-deep);text-decoration:none}
